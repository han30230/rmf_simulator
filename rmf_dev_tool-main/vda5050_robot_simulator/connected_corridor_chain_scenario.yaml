mqtt: {broker_host: localhost, broker_port: 1883}
robot_defaults:
  manufacturer: inatech
  interface_name: uagv
  protocol_version: v2.0.0
  max_speed: 1.0
  rotation_speed: 0.6
  stitching_tolerance_multiplier: 5
  last_node_update_distance: 0.1
  obstacle_detection: {enabled: false}
  battery: {initial_charge: 80.0, discharge_rate: 0.01, idle_discharge_rate: 0.001, charge_rate: 5.0}
robots:
  - {serial_number: AGV_A1, initial_position: {x: -9.0, y: 42.0, theta: 1.5708, map_id: L1}}
  - {serial_number: AGV_A2, initial_position: {x: -17.0, y: 40.8, theta: 1.5708, map_id: L1}}
  - {serial_number: AGV_B1, initial_position: {x: 107.0, y: 41.5, theta: 1.5708, map_id: L1}}
  - {serial_number: AGV_B2, initial_position: {x: 115.0, y: 42.8, theta: 1.5708, map_id: L1}}
  - {serial_number: AGV_B3, initial_position: {x: 124.0, y: 40.8, theta: 1.5708, map_id: L1}}
download_map: {map_id: L1, map_download_url: 'http://example.com/map.tar.gz', map_version: 2.4.1}
action_results: {pick: FINISHED, drop: FINISHED, startCharging: FINISHED, stopCharging: FINISHED, initPosition: FINISHED, finePositioning: FINISHED, startPause: FINISHED, stopPause: FINISHED, cancelOrder: FINISHED, factsheetRequest: FINISHED, downloadMap: FINISHED}
publishing: {state_interval: 0.5, visualization_interval: 0.5, simulation_tick: 0.05}
