  #   container_name: lift_supervisor
  #   command: ros2 run rmf_fleet_adapter lift_supervisor
  #   depends_on:
  #     - rmf_traffic_schedule

  # Mutex 그룹 관리 — 좁은 복도 등 배타적 접근 구간 제어
  mutex_group_supervisor:
    <<: *rmf-common
    container_name: mutex_group_supervisor
    command: ros2 run rmf_fleet_adapter mutex_group_supervisor
    depends_on:
      - rmf_traffic_schedule

  # Reservation 노드 — 주차 구역 충돌 해소
  rmf_reservation_node:
    <<: *rmf-common
    container_name: rmf_reservation_node
    command: ros2 run rmf_reservation_node queue_manager
    depends_on:
      - rmf_traffic_schedule

  # rmf_websocket:
