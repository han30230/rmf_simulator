  #   container_name: rmf_websocket
  #   command: ros2 run rmf_fleet_adapter fleet_state_visualizer
  #   depends_on:
  #     - rmf_traffic_schedule

  # ========================================================================
  # Web Monitoring UI — api-server + React 대시보드 (rmf-web 공식)
  # ========================================================================

  # RMF API Server — ROS2 ↔ REST/WebSocket API (http://localhost:8100)
  rmf_api_server:
    image: rmf-api-server
    network_mode: host
    ipc: host
    pid: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-55}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - RMF_API_SERVER_CONFIG=/api_server_ws/sqlite_local_config.py
    volumes:
      - ./src/rmf_dev_tool/rmf_web_custom/packages/api-server/sqlite_local_config.py:/api_server_ws/sqlite_local_config.py:ro
    restart: unless-stopped
    container_name: rmf_api_server
    depends_on:
      - rmf_traffic_schedule

  # RMF Dashboard — http://localhost:${DASHBOARD_PORT:-3100}
  rmf_web_dashboard:
    image: rmf-web-dashboard
    container_name: rmf_web_dashboard
    network_mode: host
    environment:
      - DASHBOARD_PORT=${DASHBOARD_PORT:-3100}
    volumes:
      - ./src/rmf_vda5050_fleet_adapter/map/map_dsr_0427.yaml:/opt/dashboard/nav_graph.yaml:ro
    restart: unless-stopped
    depends_on:
      - rmf_api_server

  # ========================================================================
  # Visualization — RMF 상태 시각화 (schedule, fleet, navgraph, floorplan 등)
