rmf_fleet:
  name: TOOL
  limits: {linear: [1.0, 0.75], angular: [0.6, 2.0]}
  profile: {footprint: 0.5, vicinity: 0.7}
  reversible: false
  battery_system: {voltage: 48.0, capacity: 40.0, charging_current: 8.0}
  mechanical_system: {mass: 100.0, moment_of_inertia: 20.0, friction_coefficient: 0.22}
  ambient_system: {power: 20.0}
  tool_system: {power: 0.0}
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: false
  task_capabilities: {loop: true, delivery: true}
  actions: [pick, drop, teleop, startCharging, stopCharging]
  finishing_request: nothing
  responsive_wait: false
  robot_state_update_frequency: 10.0
  robots:
    AGV_A1: {charger: CHAIN_L1, responsive_wait: false}
    AGV_A2: {charger: CHAIN_L2, responsive_wait: false}
    AGV_B1: {charger: CHAIN_R1, responsive_wait: false}
    AGV_B2: {charger: CHAIN_R2, responsive_wait: false}
    AGV_B3: {charger: CHAIN_R3, responsive_wait: false}
fleet_manager: {ip: host.docker.internal, port: 1883, prefix: uagv/v2.0.0/inatech, manufacturer: inatech, keepalive_sec: 60, reconnect_max_delay_sec: 60}
adapter: {arrival_threshold: 0.5}
reference_coordinates:
  L1:
    rmf: [[10.0, 50.0], [70.0, 50.0], [10.0, 51.0]]
    robot: [[10.0, 50.0], [70.0, 50.0], [10.0, 51.0]]
