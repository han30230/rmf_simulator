services:
  vda5050_fleet_adapter:
    command:
      - bash
      - -c
      - |
        cd /vda5050_ws &&
        colcon build --packages-select vda5050_fleet_adapter --symlink-install &&
        source install/setup.bash &&
        ros2 run vda5050_fleet_adapter fleet_adapter \
          -c /vda5050_ws/src/vda5050_fleet_adapter/config/p4_staging.yaml \
          -n /vda5050_ws/src/vda5050_fleet_adapter/map/p4_passing_bay_staging.yaml
