      direction: B_TO_A
      source_hb: P5_HB_RIGHT
      destination_hb: P5_HB_MIDDLE_SIDE
      goal_node: '7137'
    - block_id: P5_SIDE_TO_LEFT
      direction: B_TO_A
      source_hb: P5_HB_MIDDLE_SIDE
      destination_hb: P5_HB_LEFT
      goal_node: '3101'
      requires_opposite_routes_cleared: true
  - id: P5_RIGHT_TO_LEFT_DIRECT_WHEN_CLEAR
    start_nodes:
    - '3108'
    goal_nodes:
    - '3101'
    requires_no_opposite_jobs: true
    steps:
    - block_id: P5_RIGHT_TO_LEFT_DIRECT
      direction: B_TO_A
      source_hb: P5_HB_RIGHT
      destination_hb: P5_HB_LEFT
      goal_node: '3101'
