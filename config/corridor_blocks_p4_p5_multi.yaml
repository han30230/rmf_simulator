      direction: A_TO_B
      source_hb: P5_HB_LEFT
      destination_hb: P5_HB_WEST_GATE
      goal_node: '3104'
    - block_id: P5_GATE_TO_RIGHT
      direction: A_TO_B
      source_hb: P5_HB_WEST_GATE
      destination_hb: P5_HB_RIGHT
      goal_node: '3108'
      release_node: '3106'
  - id: P5_RIGHT_TO_LEFT_VIA_SIDE
    start_nodes:
    - '3108'
    goal_nodes:
    - '3101'
    steps:
